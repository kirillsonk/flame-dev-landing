# Сервер в Европе: ретранслятор и Caddy с HTTPS. Запуск: docker compose up -d --build
services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
volumes:
  caddy_data:
  caddy_config:
